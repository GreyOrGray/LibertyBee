<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liberty Bee — Cockpit</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 920px; margin: 2rem auto;
           padding: 0 1rem; color: #1a1a1a; line-height: 1.5; }
    h1, h2 { font-weight: 600; }
    h1 { font-size: 1.4rem; }
    a { color: #b8860b; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #e2ddd0; padding: 0.45rem 0.6rem; text-align: left; vertical-align: top; }
    th { background: #faf7f0; font-weight: 600; }
    input[type=text] { width: 7.5rem; padding: 0.25rem; }
    .hint { color: #8a8a8a; font-size: 0.8rem; font-weight: 400; }
    .desc { color: #555; font-size: 0.82rem; font-weight: 400; margin: 0.3rem 0; max-width: 16rem; }
    .note { background: #faf7f0; border-left: 3px solid #b8860b; padding: 0.5rem 0.85rem; margin: 1rem 0; }
    .saved { background: #eaf7ea; border-left: 3px solid #3a9a3a; padding: 0.5rem 0.85rem; margin: 1rem 0; }
    button { background: #b8860b; color: #fff; border: 0; padding: 0.5rem 1.1rem; border-radius: 5px;
             cursor: pointer; font-size: 0.95rem; }
    code { background: #f4f0e6; padding: 0.1rem 0.3rem; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>🐝 Liberty Bee — Cockpit</h1>
  {% block body %}{% endblock %}
</body>
</html>
